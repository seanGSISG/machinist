# Login and status recipes for the Connections page (docs/connections.md).
# Append the auth tables you need to worker.toml, under executors you already
# define. The executor commands below are placeholders for this example.
# Status commands were checked on 2026-09-27; confirm the login patterns with
# a first Connect before relying on them.
#
# Recipes run with a minimal environment: PATH is the recipe's `path`, or the
# worker's PATH when unset. CLIs installed with npm (codex, pi) are
# "#!/usr/bin/env node" scripts, so `path` must also contain the directory
# that holds `node`, or every status check fails with exit code 127.
# Replace /absolute/path/to/... with real directories.

[executors.claude.auth]
login = ["claude", "auth", "login", "--claudeai"]
status = ["claude", "auth", "status"]
connected_pattern = '"loggedIn":\s*true'
prompt_pattern = '(?i)paste\s+(the\s+)?code'

[executors.codex.auth]
login = ["codex", "login", "--device-auth"]
status = ["codex", "login", "status"]
connected_pattern = 'Logged in using'
code_pattern = '\b([A-Z0-9]{4,}-[A-Z0-9]{4,})\b'
path = "/absolute/path/to/cli/bin:/absolute/path/to/node/bin:/usr/local/bin:/usr/bin:/bin"

# kimi and omp have no status command: they stay "unknown" and are never
# blocked. Connect still works.
[executors.kimi]
command = ["kimi", "--print"]

[executors.kimi.auth]
login = ["kimi", "login", "--region", "global"]
code_pattern = '\b([A-Z0-9]{4,}-[A-Z0-9]{4,})\b'

[executors.omp]
command = ["omp", "-p"]

[executors.omp.auth]
login = ["omp", "login", "anthropic"]
prompt_pattern = '(?i)(paste|enter).{0,40}(code|url)'

[executors.opencode]
command = ["opencode", "run"]

[executors.opencode.auth]
login = ["opencode", "auth", "login"]
status = ["opencode", "auth", "list"]
# `opencode auth list` exits 0 even with no credentials, so require at least
# one credential line such as "OpenAI oauth" or "Anthropic api".
connected_pattern = '(?m)\b(oauth|api)\s*$'

[executors.pi]
command = ["pi", "-p"]

[executors.pi.auth]
login = ["pi"]
start_input = ["/login\r"]
prompt_pattern = '(?i)(paste|enter).{0,40}(code|url)'
path = "/absolute/path/to/cli/bin:/absolute/path/to/node/bin:/usr/local/bin:/usr/bin:/bin"
# pi checks one provider at a time. Uncomment and replace PROVIDER with the
# provider this executor runs on (`pi auth check` exits 1 for any provider
# that is not logged in, which would mark pi expired and hold its runs).
# Until then pi stays "unknown" and is never blocked.
# status = ["pi", "auth", "check", "--provider", "PROVIDER", "--json", "--no-refresh"]
# connected_pattern = '"status":\s*"ready"'
